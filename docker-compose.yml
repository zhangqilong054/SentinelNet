# SentinelNet 哨兵网络 — 校园网加密流量入侵检测系统
# 一键启动: docker compose up --build
# 访问: http://localhost:5000
#
# ADR-0001 §4.1 约束：单 worker，运行时状态全部驻留进程内。
# 禁止设置 WEB_CONCURRENCY>1 或 GUNICORN_WORKERS>1。
version: "3.8"

services:
  web:
    build: .
    container_name: campus-ids
    ports:
      - "5000:5000"
    volumes:
      - model-data:/app/data
      - log-data:/app/logs
    environment:
      - CAMPUS_IDS_DATA_DIR=/app/data
      - CAMPUS_IDS_LOG_DIR=/app/logs
      # 单 worker 约束：不设置 WEB_CONCURRENCY（默认为空，即单 worker）
      # 违反约束（WEB_CONCURRENCY>1）时 create_app() 会拒绝启动
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  model-data:
  log-data: