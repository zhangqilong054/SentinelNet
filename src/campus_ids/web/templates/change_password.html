<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - SentinelNet</title>
    <style>
        :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --error: #ef4444; --warning: #f59e0b; --success: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .card .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; }
        .form-group input { width: 100%; padding: 0.5rem 0.75rem; background: var(--bg); border: 1px solid #334155; border-radius: 6px; color: var(--text); font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn { width: 100%; padding: 0.625rem; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: var(--primary-hover); }
        .flash-messages { margin-bottom: 1rem; }
        .flash-msg { padding: 0.5rem; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .flash-msg.error { background: rgba(239,68,68,0.2); color: var(--error); }
        .flash-msg.warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .flash-msg.success { background: rgba(34,197,94,0.2); color: var(--success); }
    </style>
</head>
<body>
    <div class="card">
        <h1>修改密码</h1>
        <p class="subtitle">请设置一个新密码以替代默认密码</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash-msg {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="old_password">旧密码</label>
                <input type="password" id="old_password" name="old_password" required autofocus>
            </div>
            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" required minlength="6">
            </div>
            <button type="submit" class="btn">确认修改</button>
        </form>
    </div>
</body>
</html>
