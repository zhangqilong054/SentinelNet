{% extends "base.html" %}
{% block title %}SentinelNet — 修改密码{% endblock %}
{% block body_class %}page-centered{% endblock %}

{% block content %}
<div class="card card--narrow">
    <h1 class="brand">修改密码</h1>
    <p class="subtitle">当前用户：<code>{{ username or '未登录' }}</code></p>

    {% if error %}
    <div class="flash flash--error">{{ error }}</div>
    {% endif %}
    {% if message %}
    <div class="flash flash--success">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="old_password">当前密码</label>
            <input type="password" id="old_password" name="old_password"
                   autocomplete="current-password" required autofocus>
        </div>
        <div class="form-group">
            <label for="new_password">新密码（至少 6 位）</label>
            <input type="password" id="new_password" name="new_password"
                   autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">提交</button>
    </form>

    <div class="hint"><a href="/">← 返回控制台</a></div>
</div>
{% endblock %}
