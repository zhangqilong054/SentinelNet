[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-net"
version = "0.1.0"
description = "SentinelNet 哨兵网络 — 校园网加密流量入侵检测系统"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "scapy>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.11",
    "tqdm>=4.60",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"campus_ids.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
