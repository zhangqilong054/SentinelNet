[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-net"
version = "0.1.0"
description = "SentinelNet 哨兵网络 — 校园网加密流量入侵检测系统"
requires-python = ">=3.13"
dependencies = [
    # ── FastAPI 生态（ADR-0001）────────────────────────────────
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sse-starlette>=2.0",
    "slowapi>=0.1.9",
    # ── 安全响应头（ADR-0001 §1.1 / §6 #3，T1.11 ③）──────────
    "secure>=0.3.0",
    # ── 既有依赖 ──────────────────────────────────────────────
    "flask>=3.0",
    "scapy>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.11",
    "tqdm>=4.60",
    "matplotlib>=3.7",
    "waitress>=2.1",
    "flask-talisman>=1.0",
    "flask-login>=0.6",
    "flask-cors>=4.0",
    "flask-limiter>=3.0",
    "flask-wtf>=1.2",
    "python-dotenv>=1.0",
    "flasgger>=0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # ── 开发期工具（ADR-0001 §1.1）────────────────────────────
    "pytest-regressions>=0.1",    # T0.2/T0.3: golden file 录制与比对
    "pytest-alembic>=0.1",        # T1.10: 迁移链自动化测试
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"campus_ids.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
