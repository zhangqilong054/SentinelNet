# Alembic configuration (T1.10)
#
# NOTE (Windows): this file MUST stay ASCII-only.
# Alembic reads alembic.ini with encoding="locale"; on a zh-CN Windows box that is
# cp936/GBK, and any non-ASCII byte here raises UnicodeDecodeError at Config() time
# (comments in Chinese included). Comments live in migrations/env.py instead.
#
# NOTE: `sqlalchemy.url` is deliberately left EMPTY -- migrations/env.py derives it
# from campus_ids.runtime.settings.Settings.data_dir, so the migration target can
# never drift from the directory the app actually runs against.
#
# Point it somewhere else per-invocation:
#     CAMPUS_IDS_DATA_DIR=/path/to/tmp python -m alembic upgrade head
# or override explicitly:
#     python -m alembic -x db_url=sqlite:///tmp/dev.db upgrade head

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
sqlalchemy.url =

# Timestamp-prefixed filenames keep multi-branch merges readable by humans
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
